<!DOCTYPE html>
<html lang="en" class="h-full bg-[#070b14] text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Advisors | NexusGrad</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Cabinet Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-[100dvh] flex flex-col bg-[#070b14] text-slate-100 font-sans overflow-x-hidden">

  <!-- Floating Pill Header -->
  <div class="header-shell fixed top-0 inset-x-0 z-50 flex justify-center pointer-events-none" id="headerShell">
    <header id="mainHeader" class="header-bar pointer-events-auto flex items-center justify-between w-full max-w-[1400px] px-6 py-4 bg-slate-900/90 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2.5 group">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 group-hover:scale-105 transition-transform duration-200">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" /></svg>
          </div>
          <div class="flex flex-col">
            <span class="font-display text-lg font-bold tracking-tight text-white flex items-center gap-1">
              Nexus<span class="text-emerald-400 font-black">Grad</span>
            </span>
            <span class="text-[10px] font-mono text-slate-400 uppercase tracking-widest hidden sm:inline">Workspace Portal</span>
          </div>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="/" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Dashboard</a>
        <a href="/projects" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Projects</a>
        <a href="/milestones" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Milestones</a>
        <a href="/defense" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Defense & Rubric</a>
        <a href="/supervisors" class="text-emerald-400 font-semibold whitespace-nowrap">Supervisors</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="/api-docs" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-mono px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition-all">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          API Docs
        </a>
        <a href="/projects#submit" class="inline-flex items-center gap-2 text-xs font-semibold px-4 py-2 rounded-full bg-emerald-500 text-slate-950 hover:bg-emerald-400 active:scale-95 transition-all shadow-lg shadow-emerald-500/20 whitespace-nowrap">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
          <span>Submit Project</span>
        </a>
      </div>
    </header>
  </div>

  <main class="flex-1 w-full pt-28 pb-16">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 space-y-12">

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 class="font-display text-3xl sm:text-4xl font-extrabold text-white">
            Faculty <span class="text-emerald-400">Advisors Roster</span>
          </h1>
          <p class="text-sm sm:text-base text-slate-300 mt-1">
            Faculty mentors, research specializations, and student supervision capacities.
          </p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="supervisorsGrid"></div>

    </div>
  </main>

  <script src="/js/header.js"></script>
  <script>
    async function loadSupervisors() {
      const sups = await fetch('/api/supervisors').then(r => r.json());
      const grid = document.getElementById('supervisorsGrid');

      grid.innerHTML = sups.map(s => {
        const pct = Math.min(100, Math.round((s.currentProjectsCount / s.maxProjectsQuota) * 100));
        return `
          <div class="rounded-3xl bg-slate-900/80 p-6 flex flex-col justify-between space-y-6 hover:bg-slate-850 transition-colors">
            <div class="space-y-4">
              <div class="flex items-start gap-4">
                <img src="${s.avatarUrl}" alt="${s.fullName}" class="w-16 h-16 rounded-2xl object-cover bg-slate-800 shrink-0" />
                <div class="min-w-0 flex-1">
                  <span class="text-xs font-mono text-emerald-400 uppercase">${s.title}</span>
                  <h3 class="font-display text-lg font-bold text-white truncate">${s.fullName}</h3>
                  <p class="text-xs text-slate-400 truncate">${s.department}</p>
                </div>
              </div>

              <div class="space-y-2 text-xs">
                <div class="p-3 rounded-xl bg-slate-950 text-slate-300 leading-relaxed">
                  <strong class="text-slate-400 font-mono block text-[10px] uppercase mb-1">Research Focus</strong>
                  ${s.researchInterests}
                </div>
              </div>
            </div>

            <div class="space-y-4 pt-4">
              <div class="space-y-1.5 text-xs">
                <div class="flex items-center justify-between">
                  <span class="text-slate-400">Supervision Load</span>
                  <span class="font-mono ${s.availableCapacity > 0 ? 'text-emerald-400' : 'text-amber-400'} font-medium">
                    ${s.currentProjectsCount} / ${s.maxProjectsQuota} Projects
                  </span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                  <div class="bg-emerald-500 h-full rounded-full" style="width: ${pct}%"></div>
                </div>
              </div>

              <div class="p-3 rounded-xl bg-slate-950/60 flex items-center justify-between text-xs text-slate-400">
                <span class="truncate">Office: ${s.officeLocation}</span>
                <a href="mailto:${s.email}" class="text-emerald-400 hover:underline font-mono text-[11px] shrink-0">Email &rarr;</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadSupervisors();
  </script>
</body>
</html>
