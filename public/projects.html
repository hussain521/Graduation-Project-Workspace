<!DOCTYPE html>
<html lang="en" class="h-full bg-[#070b14] text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Catalog | NexusGrad Workspace</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Cabinet Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-[100dvh] flex flex-col bg-[#070b14] text-slate-100 font-sans overflow-x-hidden">

  <!-- Floating Pill Header -->
  <div class="header-shell fixed top-0 inset-x-0 z-50 flex justify-center pointer-events-none" id="headerShell">
    <header id="mainHeader" class="header-bar pointer-events-auto flex items-center justify-between w-full max-w-[1400px] px-6 py-4 bg-slate-900/90 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2.5 group">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 group-hover:scale-105 transition-transform duration-200">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" /></svg>
          </div>
          <div class="flex flex-col">
            <span class="font-display text-lg font-bold tracking-tight text-white flex items-center gap-1">
              Nexus<span class="text-emerald-400 font-black">Grad</span>
            </span>
            <span class="text-[10px] font-mono text-slate-400 uppercase tracking-widest hidden sm:inline">Workspace Portal</span>
          </div>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="/" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Dashboard</a>
        <a href="/projects" class="text-emerald-400 font-semibold whitespace-nowrap">Projects</a>
        <a href="/milestones" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Milestones</a>
        <a href="/defense" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Defense & Rubric</a>
        <a href="/supervisors" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Supervisors</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="/api-docs" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-mono px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition-all">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          API Docs
        </a>
        <button onclick="openSubmitModal()" class="inline-flex items-center gap-2 text-xs font-semibold px-4 py-2 rounded-full bg-emerald-500 text-slate-950 hover:bg-emerald-400 active:scale-95 transition-all shadow-lg shadow-emerald-500/20 whitespace-nowrap">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
          <span>Submit Project</span>
        </button>
      </div>
    </header>
  </div>

  <!-- Main Container -->
  <main class="flex-1 w-full pt-28 pb-16">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 space-y-12">

      <!-- Header & Filter Bar -->
      <div class="space-y-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <h1 class="font-display text-3xl sm:text-4xl font-extrabold text-white">
              Capstone <span class="text-emerald-400">Projects Directory</span>
            </h1>
            <p class="text-sm sm:text-base text-slate-300 mt-1">
              Explore senior design prototypes, research papers, and software systems.
            </p>
          </div>
          <button onclick="openSubmitModal()" class="px-5 py-2.5 rounded-full bg-emerald-500 text-slate-950 font-semibold hover:bg-emerald-400 active:scale-95 transition-all text-sm flex items-center gap-2 shadow-lg shadow-emerald-500/20 whitespace-nowrap">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span>Propose New Project</span>
          </button>
        </div>

        <!-- Filter Controls -->
        <div class="p-4 rounded-2xl bg-slate-900/90 flex flex-wrap items-center gap-4 text-sm">
          <div class="flex-1 min-w-[240px]">
            <div class="relative">
              <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search by title, keywords, tech stack..." 
                     class="w-full bg-slate-800 text-slate-100 placeholder-slate-400 rounded-xl px-4 py-2.5 pl-10 focus:outline-none focus:ring-2 focus:ring-emerald-400" />
              <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
          </div>

          <div class="w-full sm:w-auto">
            <select id="trackFilter" onchange="applyFilters()" class="w-full bg-slate-800 text-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-400">
              <option value="">All Engineering Tracks</option>
              <option value="Artificial Intelligence">Artificial Intelligence</option>
              <option value="Cybersecurity">Cybersecurity</option>
              <option value="Cloud & DevOps">Cloud & DevOps</option>
              <option value="Software Engineering">Software Engineering</option>
              <option value="IoT & Embedded">IoT & Embedded</option>
              <option value="Data Science">Data Science</option>
            </select>
          </div>

          <div class="w-full sm:w-auto">
            <select id="statusFilter" onchange="applyFilters()" class="w-full bg-slate-800 text-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-400">
              <option value="">All Statuses</option>
              <option value="Proposed">Proposed</option>
              <option value="Approved">Approved</option>
              <option value="In Progress">In Progress</option>
              <option value="Ready for Defense">Ready for Defense</option>
              <option value="Defended">Defended</option>
            </select>
          </div>

          <button onclick="resetFilters()" class="text-xs font-mono text-slate-400 hover:text-rose-400 transition-colors py-2">
            Reset Filters
          </button>
        </div>
      </div>

      <!-- Projects Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="projectsGrid">
        <!-- Rendered via JS -->
      </div>

    </div>
  </main>

  <!-- Project Details Modal -->
  <div id="detailsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
    <div class="relative w-full max-w-4xl rounded-3xl bg-slate-900 p-6 sm:p-8 space-y-8 my-8 shadow-2xl max-h-[90vh] overflow-y-auto" id="detailsModalContent">
      <!-- Populated via JS -->
    </div>
  </div>

  <!-- Submit Proposal Modal -->
  <div id="submitModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
    <div class="relative w-full max-w-2xl rounded-3xl bg-slate-900 p-6 sm:p-8 space-y-6 my-8 shadow-2xl">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="font-display text-2xl font-bold text-white">Propose Graduation Project</h3>
          <p class="text-xs sm:text-sm text-slate-400">Submit your capstone concept for faculty review</p>
        </div>
        <button onclick="closeSubmitModal()" class="p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="proposalForm" onsubmit="handleProposalSubmit(event)" class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-mono text-slate-300 uppercase mb-1">Project Title *</label>
          <input type="text" id="propTitle" required placeholder="e.g. Autonomous Robotic Surgery Simulation System" class="w-full bg-slate-800 text-slate-100 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-400 outline-none" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-mono text-slate-300 uppercase mb-1">Engineering Track *</label>
            <select id="propTrack" class="w-full bg-slate-800 text-slate-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-400 outline-none">
              <option value="Artificial Intelligence">Artificial Intelligence</option>
              <option value="Cybersecurity">Cybersecurity</option>
              <option value="Cloud & DevOps">Cloud & DevOps</option>
              <option value="Software Engineering">Software Engineering</option>
              <option value="IoT & Embedded">IoT & Embedded</option>
              <option value="Data Science">Data Science</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-mono text-slate-300 uppercase mb-1">Preferred Faculty Advisor</label>
            <select id="propSupervisor" class="w-full bg-slate-800 text-slate-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-400 outline-none">
              <option value="">-- Choose Advisor --</option>
              <!-- Loaded dynamically -->
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-mono text-slate-300 uppercase mb-1">Executive Abstract *</label>
          <textarea id="propAbstract" required rows="3" placeholder="Summarize problem statement, approach, methodology and target outcomes..." class="w-full bg-slate-800 text-slate-100 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-400 outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-mono text-slate-300 uppercase mb-1">Technologies & Stack</label>
          <input type="text" id="propTech" placeholder="e.g. C#, ASP.NET Core, PyTorch, React, Docker" class="w-full bg-slate-800 text-slate-100 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-400 outline-none" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-mono text-slate-300 uppercase mb-1">Lead Student Name *</label>
            <input type="text" id="propLeadName" required placeholder="e.g. Hussain Al-Ahmad" class="w-full bg-slate-800 text-slate-100 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-400 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-mono text-slate-300 uppercase mb-1">Student University ID</label>
            <input type="text" id="propLeadId" placeholder="e.g. ST-2022-9012" class="w-full bg-slate-800 text-slate-100 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-400 outline-none" />
          </div>
        </div>

        <div id="submitAlert" class="hidden p-3 rounded-xl bg-emerald-500/10 text-emerald-400 text-xs"></div>

        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" onclick="closeSubmitModal()" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700 transition-colors">
            Cancel
          </button>
          <button type="submit" id="submitBtn" class="px-6 py-2.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-bold hover:bg-emerald-400 active:scale-95 transition-all">
            Submit Proposal
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/header.js"></script>
  <script>
    let allProjects = [];
    let allSupervisors = [];

    async function init() {
      try {
        const [projRes, supRes] = await Promise.all([
          fetch('/api/projects').then(r => r.json()),
          fetch('/api/supervisors').then(r => r.json())
        ]);
        allProjects = projRes;
        allSupervisors = supRes;

        // Populate supervisor dropdown
        const select = document.getElementById('propSupervisor');
        select.innerHTML = `<option value="">-- Choose Advisor --</option>` + allSupervisors.map(s => `
          <option value="${s.id}">${s.fullName} (${s.department})</option>
        `).join('');

        renderProjects(allProjects);

        // Check URL params
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('id');
        if (pid) {
          openProjectDetails(pid);
        }
        if (window.location.hash === '#submit') {
          openSubmitModal();
        }
      } catch (e) {
        console.error("Init failed", e);
      }
    }

    function renderProjects(list) {
      const grid = document.getElementById('projectsGrid');
      if (!list.length) {
        grid.innerHTML = `
          <div class="col-span-full p-12 text-center rounded-3xl bg-slate-900/50 space-y-3">
            <p class="text-base text-slate-300">No projects found matching your search or filter criteria.</p>
            <button onclick="resetFilters()" class="text-xs font-mono text-emerald-400 hover:underline">Reset Filters</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(p => {
        const completed = (p.milestones || []).filter(m => m.status === 'Approved').length;
        const total = (p.milestones || []).length || 1;
        const pct = Math.round((completed / total) * 100);

        return `
          <div class="rounded-3xl bg-slate-900/80 hover:bg-slate-850 transition-all flex flex-col justify-between overflow-hidden group">
            <div class="relative h-44 overflow-hidden bg-slate-950">
              <img src="${p.thumbnailUrl}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80 group-hover:opacity-100" />
              <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/30 to-transparent"></div>
              <span class="absolute top-4 left-4 text-xs font-mono uppercase px-3 py-1 rounded-full bg-slate-900/90 backdrop-blur-md text-emerald-400 font-medium">
                ${p.track}
              </span>
              ${p.finalGrade ? `<span class="absolute top-4 right-4 text-xs font-mono font-bold px-2.5 py-1 rounded-full bg-emerald-500 text-slate-950">${p.finalGrade}%</span>` : ''}
            </div>

            <div class="p-6 flex-1 flex flex-col justify-between space-y-6">
              <div class="space-y-3">
                <h3 class="font-display text-lg font-bold text-white line-clamp-2 group-hover:text-emerald-400 transition-colors">
                  ${p.title}
                </h3>
                <p class="text-xs sm:text-sm text-slate-300 line-clamp-3 leading-relaxed">
                  ${p.abstract}
                </p>
              </div>

              <div class="space-y-4 pt-2">
                <div class="space-y-2 text-xs text-slate-400">
                  <div class="flex items-center justify-between">
                    <span>Advisor: <strong class="text-slate-200">${p.supervisor ? p.supervisor.fullName : 'TBD'}</strong></span>
                    <span>Team: <strong class="text-slate-200">${(p.teamMembers || []).length} members</strong></span>
                  </div>
                  <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-emerald-500 h-full rounded-full" style="width: ${pct}%"></div>
                  </div>
                  <div class="flex items-center justify-between text-[11px] font-mono text-slate-400">
                    <span>Milestones: ${completed}/${(p.milestones || []).length}</span>
                    <span>${pct}% Completed</span>
                  </div>
                </div>

                <div class="flex items-center justify-between pt-2">
                  <span class="text-xs font-mono text-slate-400">${p.academicYear}</span>
                  <button onclick="openProjectDetails(${p.id})" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-emerald-500 hover:text-slate-950 text-slate-200 text-xs font-semibold transition-all">
                    View Details
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const track = document.getElementById('trackFilter').value;
      const status = document.getElementById('statusFilter').value;

      let filtered = allProjects.filter(p => {
        const matchesSearch = !search || 
          p.title.toLowerCase().includes(search) || 
          p.abstract.toLowerCase().includes(search) ||
          (p.techStack && p.techStack.toLowerCase().includes(search));
        
        const matchesTrack = !track || p.track.toLowerCase() === track.toLowerCase();
        const matchesStatus = !status || p.status.toLowerCase() === status.toLowerCase();

        return matchesSearch && matchesTrack && matchesStatus;
      });

      renderProjects(filtered);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('trackFilter').value = '';
      document.getElementById('statusFilter').value = '';
      renderProjects(allProjects);
    }

    function openProjectDetails(id) {
      const p = allProjects.find(x => x.id === parseInt(id));
      if (!p) return;

      const content = document.getElementById('detailsModalContent');
      content.innerHTML = `
        <button onclick="closeDetailsModal()" class="absolute top-6 right-6 p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

        <div class="space-y-3 pr-10">
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs font-mono uppercase px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 font-medium">${p.track}</span>
            <span class="text-xs font-mono px-3 py-1 rounded-full bg-slate-800 text-slate-300">Status: ${p.status}</span>
            ${p.finalGrade ? `<span class="text-xs font-mono font-bold px-3 py-1 rounded-full bg-emerald-500 text-slate-950">Final Grade: ${p.finalGrade}%</span>` : ''}
          </div>
          <h2 class="font-display text-2xl sm:text-3xl font-bold text-white">${p.title}</h2>
        </div>

        <div class="space-y-4">
          <h4 class="text-xs font-mono text-emerald-400 uppercase tracking-wider">Executive Abstract</h4>
          <p class="text-sm sm:text-base text-slate-300 leading-relaxed bg-slate-950 p-5 rounded-2xl">${p.abstract}</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="p-5 rounded-2xl bg-slate-850 space-y-3">
            <h4 class="text-xs font-mono text-slate-400 uppercase">Supervisor & Department</h4>
            ${p.supervisor ? `
              <div class="flex items-center gap-3">
                <img src="${p.supervisor.avatarUrl}" class="w-12 h-12 rounded-full object-cover" />
                <div>
                  <h5 class="text-sm font-bold text-white">${p.supervisor.fullName}</h5>
                  <p class="text-xs text-slate-400">${p.supervisor.department}</p>
                  <p class="text-xs font-mono text-emerald-400">${p.supervisor.email}</p>
                </div>
              </div>
            ` : '<p class="text-xs text-slate-400">No supervisor assigned.</p>'}
          </div>

          <div class="p-5 rounded-2xl bg-slate-850 space-y-3">
            <h4 class="text-xs font-mono text-slate-400 uppercase">Student Engineering Team</h4>
            <div class="space-y-2 max-h-40 overflow-y-auto">
              ${(p.teamMembers || []).map(m => `
                <div class="flex items-center justify-between text-xs">
                  <span class="font-medium text-slate-200">${m.fullName}</span>
                  <span class="font-mono text-slate-400">${m.role}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <h4 class="text-xs font-mono text-emerald-400 uppercase">Milestones & Deliverables</h4>
          <div class="space-y-2">
            ${(p.milestones || []).map(ms => `
              <div class="p-3.5 rounded-xl bg-slate-950 flex items-center justify-between gap-4 text-xs">
                <div>
                  <div class="font-semibold text-slate-200">${ms.title}</div>
                  <div class="text-slate-400 text-[11px]">Due: ${ms.dueDate} • Weight: ${ms.weightPercentage}%</div>
                </div>
                <span class="font-mono px-2.5 py-1 rounded-md bg-slate-800 text-slate-300">${ms.status}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4">
          <button onclick="closeDetailsModal()" class="px-6 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700 transition-colors">Close</button>
          <a href="/defense?projectId=${p.id}" class="px-6 py-2.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-bold hover:bg-emerald-400 transition-colors">Open Evaluation Rubric</a>
        </div>
      `;

      document.getElementById('detailsModal').classList.remove('hidden');
    }

    function closeDetailsModal() {
      document.getElementById('detailsModal').classList.add('hidden');
    }

    function openSubmitModal() {
      document.getElementById('submitModal').classList.remove('hidden');
    }

    function closeSubmitModal() {
      document.getElementById('submitModal').classList.add('hidden');
    }

    async function handleProposalSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('submitAlert');
      btn.disabled = true;
      btn.innerText = "Submitting...";

      const payload = {
        title: document.getElementById('propTitle').value,
        track: document.getElementById('propTrack').value,
        supervisorId: document.getElementById('propSupervisor').value || null,
        abstract: document.getElementById('propAbstract').value,
        techStack: document.getElementById('propTech').value,
        teamMembers: [
          {
            id: Date.now(),
            fullName: document.getElementById('propLeadName').value,
            studentId: document.getElementById('propLeadId').value || "ST-2022-9012",
            role: "Team Lead",
            major: "Software Engineering"
          }
        ]
      };

      try {
        const resp = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (resp.ok) {
          alertBox.classList.remove('hidden');
          alertBox.innerText = "Proposal submitted successfully! Updating directory...";
          setTimeout(() => {
            window.location.reload();
          }, 800);
        } else {
          alert("Error submitting proposal.");
          btn.disabled = false;
          btn.innerText = "Submit Proposal";
        }
      } catch (err) {
        alert("Network error.");
        btn.disabled = false;
        btn.innerText = "Submit Proposal";
      }
    }

    init();
  </script>
</body>
</html>
