<!DOCTYPE html>
<html lang="en" class="h-full bg-[#070b14] text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REST API Documentation & Interactive Console | NexusGrad</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Cabinet Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-[100dvh] flex flex-col bg-[#070b14] text-slate-100 font-sans overflow-x-hidden">

  <!-- Floating Pill Header -->
  <div class="header-shell fixed top-0 inset-x-0 z-50 flex justify-center pointer-events-none" id="headerShell">
    <header id="mainHeader" class="header-bar pointer-events-auto flex items-center justify-between w-full max-w-[1400px] px-6 py-4 bg-slate-900/90 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2.5 group">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 group-hover:scale-105 transition-transform duration-200">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" /></svg>
          </div>
          <div class="flex flex-col">
            <span class="font-display text-lg font-bold tracking-tight text-white flex items-center gap-1">
              Nexus<span class="text-emerald-400 font-black">Grad</span>
            </span>
            <span class="text-[10px] font-mono text-slate-400 uppercase tracking-widest hidden sm:inline">Workspace Portal</span>
          </div>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="/" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Dashboard</a>
        <a href="/projects" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Projects</a>
        <a href="/milestones" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Milestones</a>
        <a href="/defense" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Defense & Rubric</a>
        <a href="/supervisors" class="text-slate-300 hover:text-white transition-colors whitespace-nowrap">Supervisors</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="/" class="inline-flex items-center gap-2 text-xs font-semibold px-4 py-2 rounded-full bg-slate-800 text-slate-200 hover:text-white transition-all whitespace-nowrap">
          <span>&larr; Back to App</span>
        </a>
      </div>
    </header>
  </div>

  <main class="flex-1 w-full pt-28 pb-16">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 space-y-12">

      <div>
        <h1 class="font-display text-3xl sm:text-4xl font-extrabold text-white">
          REST API <span class="text-emerald-400">Interactive Documentation</span>
        </h1>
        <p class="text-sm sm:text-base text-slate-300 mt-1">
          Explore and test real-time JSON API endpoints directly from the browser.
        </p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Endpoints List (5 cols) -->
        <div class="lg:col-span-5 space-y-4">
          <h3 class="text-xs font-mono text-emerald-400 uppercase tracking-wider">Available Endpoints</h3>

          <button onclick="testApi('GET', '/api/stats')" class="w-full text-left p-4 rounded-2xl bg-slate-900/90 hover:bg-slate-850 flex items-center justify-between transition-colors">
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 font-mono text-xs font-bold">GET</span>
              <span class="font-mono text-xs text-slate-200">/api/stats</span>
            </div>
            <span class="text-xs text-slate-400">Overview Metrics</span>
          </button>

          <button onclick="testApi('GET', '/api/projects')" class="w-full text-left p-4 rounded-2xl bg-slate-900/90 hover:bg-slate-850 flex items-center justify-between transition-colors">
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 font-mono text-xs font-bold">GET</span>
              <span class="font-mono text-xs text-slate-200">/api/projects</span>
            </div>
            <span class="text-xs text-slate-400">All Projects</span>
          </button>

          <button onclick="testApi('GET', '/api/projects/1')" class="w-full text-left p-4 rounded-2xl bg-slate-900/90 hover:bg-slate-850 flex items-center justify-between transition-colors">
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 font-mono text-xs font-bold">GET</span>
              <span class="font-mono text-xs text-slate-200">/api/projects/1</span>
            </div>
            <span class="text-xs text-slate-400">Single Project</span>
          </button>

          <button onclick="testApi('GET', '/api/supervisors')" class="w-full text-left p-4 rounded-2xl bg-slate-900/90 hover:bg-slate-850 flex items-center justify-between transition-colors">
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 font-mono text-xs font-bold">GET</span>
              <span class="font-mono text-xs text-slate-200">/api/supervisors</span>
            </div>
            <span class="text-xs text-slate-400">Faculty Roster</span>
          </button>

          <button onclick="testApi('GET', '/api/announcements')" class="w-full text-left p-4 rounded-2xl bg-slate-900/90 hover:bg-slate-850 flex items-center justify-between transition-colors">
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 font-mono text-xs font-bold">GET</span>
              <span class="font-mono text-xs text-slate-200">/api/announcements</span>
            </div>
            <span class="text-xs text-slate-400">Notices</span>
          </button>
        </div>

        <!-- Interactive Console (7 cols) -->
        <div class="lg:col-span-7 rounded-3xl bg-slate-900/90 p-6 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-display text-lg font-bold text-white">Live Response Console</h3>
            <span id="responseStatus" class="font-mono text-xs px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400">HTTP 200 OK</span>
          </div>

          <div class="p-3 rounded-xl bg-slate-950 font-mono text-xs text-slate-300 flex items-center justify-between">
            <span id="requestEndpoint">GET /api/stats</span>
            <button onclick="executeCurrent()" class="px-3 py-1 rounded-lg bg-emerald-500 text-slate-950 font-bold hover:bg-emerald-400 text-xs">Send Request</button>
          </div>

          <pre id="jsonOutput" class="p-5 rounded-2xl bg-slate-950 text-emerald-400 font-mono text-xs overflow-x-auto max-h-[500px] leading-relaxed"></pre>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/header.js"></script>
  <script>
    let currentMethod = 'GET';
    let currentUrl = '/api/stats';

    async function testApi(method, url) {
      currentMethod = method;
      currentUrl = url;
      document.getElementById('requestEndpoint').innerText = `${method} ${url}`;
      await executeCurrent();
    }

    async function executeCurrent() {
      const output = document.getElementById('jsonOutput');
      const statusBox = document.getElementById('responseStatus');
      output.innerText = 'Fetching...';

      try {
        const t0 = performance.now();
        const res = await fetch(currentUrl, { method: currentMethod });
        const time = (performance.now() - t0).toFixed(0);
        const data = await res.json();

        statusBox.innerText = `HTTP ${res.status} ${res.statusText} (${time}ms)`;
        output.innerText = JSON.stringify(data, null, 2);
      } catch (e) {
        statusBox.innerText = `ERR`;
        output.innerText = 'Error: ' + e.message;
      }
    }

    testApi('GET', '/api/stats');
  </script>
</body>
</html>
